on:
  push:
  pull_request:

name: Build and Test

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --force
      - name: Lint
        run: npm run lint
      - name: Build
        run: NODE_ENV=production CI=false npm run tsc
      - name: Run Test Suite
        run: npm run test
      - name: Test Mobile Python Parity
        run: npm run test:mobile
      - name: Verify Packed Package
        run: NODE_ENV=production npm run smoke:packed
      - name: Build Docs
        run: NODE_ENV=production CI=false npm run docs
      - name: Audit production dependencies
        run: npm audit --omit=optional
        continue-on-error: true
      - name: Pack checkpoint artifact
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-exchange.')
        run: npm pack
      - name: Publish checkpoint GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-exchange.')
        uses: softprops/action-gh-release@v2
        with:
          files: item-systems-item-*.tgz
          body_path: RELEASE_NOTES.md
          prerelease: true
          generate_release_notes: true
