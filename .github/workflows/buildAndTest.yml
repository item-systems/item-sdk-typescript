on:
  push:
  pull_request:

name: Build and Test

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --force
      - name: Lint
        run: npm run lint
      - name: Build
        run: NODE_ENV=production CI=false npm run tsc
      - name: Run Test Suite
        run: npm run test
      - name: Verify Packed Package
        run: npm run smoke:packed
      - name: Build Docs
        run: NODE_ENV=production CI=false npm run docs
      - name: Audit production dependencies
        run: npm audit --omit=optional
        continue-on-error: true
